name: CI

# Vercel's `next build` already enforces TypeScript and ESLint on deploy, but it
# does not run the unit tests or the i18n parity check. This workflow gates
# those (plus type/lint as fast pre-deploy feedback) so regressions are caught
# before they reach main → production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n locale parity
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      # The July 2026 outage class: code that passes type/lint/tests but fails
      # to BUILD (or ships a bundle regression). CI now builds for real.
      # Placeholder Supabase publics keep client bootstrap happy; no page
      # fetches from Supabase at build time (verified locally with env
      # stripped, 2026-08-13). i18n:scan is NOT gated here yet — it carries
      # 91 pre-existing false positives; it joins CI when WP-I18N-02 fixes
      # the scanner.
      - name: Production build
        run: npm run build 2>&1 | tee build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

      - name: Bundle budgets
        run: node scripts/check-bundle-budget.mjs build.log
