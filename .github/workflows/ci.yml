name: CI

# Vercel's `next build` already enforces TypeScript and ESLint on deploy, but it
# does not run the unit tests or the i18n parity check. This workflow gates
# those (plus type/lint as fast pre-deploy feedback) so regressions are caught
# before they reach main → production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n locale parity
        run: npm run i18n:check

      - name: Unit tests
        run: npm test
