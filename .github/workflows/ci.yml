name: CI

# Vercel's `next build` already enforces TypeScript and ESLint on deploy, but it
# does not run the unit tests or the i18n parity check. This workflow gates
# those (plus type/lint as fast pre-deploy feedback) so regressions are caught
# before they reach main → production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n locale parity
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      # The July 2026 outage class: code that passes type/lint/tests but fails
      # to BUILD (or ships a bundle regression). CI now builds for real.
      # Placeholder Supabase publics keep client bootstrap happy; no page
      # fetches from Supabase at build time (verified locally with env
      # stripped, 2026-08-13). i18n:scan is NOT gated here yet — it carries
      # 91 pre-existing false positives; it joins CI when WP-I18N-02 fixes
      # the scanner.
      - name: Production build
        run: npm run build 2>&1 | tee build.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          # picocolors force-colors when CI=true even without a TTY, which
          # would ANSI-wrap the route table and blind the budget parser.
          NO_COLOR: "1"

      - name: Bundle budgets
        run: node scripts/check-bundle-budget.mjs build.log

  # WP-DATABASE-10: repo migration filenames vs prod's applied-ledger. The
  # July-era drift (48 findings) is annotated in
  # docs/claude/migration-drift-baseline.json; this job fails only on NEW
  # drift. Runs read-only against the Management API and needs a read-only
  # personal access token — until the owner adds the SUPABASE_ACCESS_TOKEN
  # repo secret, the step reports itself skipped and stays green.
  migration-drift:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: kohuiyqyixvrcqeepalz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration drift check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not configured — migration-drift check skipped (owner: add a read-only Supabase PAT to enable it)."
            exit 0
          fi
          npm run db:drift
